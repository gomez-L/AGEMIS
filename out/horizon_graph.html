<script>
  const graphModuleDetails = {"Digital Finance Regulatory Perimeter": "Digital Finance Regulatory Perimeter\n\nReasoning:\nImplications 2, 3, 5, and 6 form a coherent subsystem of regulatory perimeter expansion into digital infrastructure and digital-asset activities. They share a transmission path in which operational failures, concentration in critical ICT providers, and digital-asset volatility are brought under supervisory scrutiny to prevent spillovers into banks and the wider financial system through common infrastructure, counterparty linkages, and bank balance sheets.\n\nSignals supporting this module:\n  • EU Digital Operational Resilience Act (DORA) applies from 17 January 2025\n  • FSB Work Programme for 2025\n  • US Executive Order 14178 'Strengthening American Leadership in Digital Financial Technology' prohibits a US CBDC\n", "Monetary Policy Stance and Transmission": "Monetary Policy Stance and Transmission\n\nReasoning:\nAll implications describe central bank policy-rate decisions and their transmission to financial stability through bank profitability, funding costs, debt servicing, asset valuations, credit availability, and market liquidity. Although the directional stance varies across jurisdictions, the subsystem and transmission path are identical.\n\nSignals supporting this module:\n  • Bank of Japan raises policy rate to 0.5%, the highest level since 2008\n  • ECB January 2025 – Rate Cut -25bp, Deposit Rate 2.75%\n  • Fed FOMC January 2025 – Rates Held at 4.25-4.50% (Hawkish Hold)\n  • Swiss consumer prices fell 0.1% in December 2024; average annual inflation of 1.1% in 2024\n", "Bank capital regulation framework": "Bank capital regulation framework\n\nReasoning:\nThe implications describe one prudential subsystem: bank capital and lending regulation. Drivers include Basel III transposition, risk retention rules, supervisory standards, and political shifts in oversight. The shared transmission path runs from capital requirements and underwriting standards to bank loss-absorbing capacity, risk-taking, credit supply, and risk migration to non-banks, ultimately shaping systemic vulnerability, contagion, and procyclicality.\n\nSignals supporting this module:\n  • FSB: G20 Financial Regulatory Reforms Have Enhanced Securitisation Market Resilience\n  • Fed's top bank supervisor Michael Barr to step down as Vice Chair for Supervision\n  • Final Basel III standards enter into force in Switzerland on 1 January 2025\n  • Stricter capital and self-regulation rules for mortgage lending take effect in Switzerland\n", "Climate financial risk surveillance": "Climate financial risk surveillance\n\nReasoning:\nThe implications describe one subsystem in which climate physical and transition risks transmit to financial stability through asset repricing, collateral devaluation, insurance protection gaps, and insurer capital erosion. Implications one to three show authorities institutionalizing climate risk tools and macroprudential responses; implications four to nine show physical risks crystallizing through real estate, insurance, and reinsurance channels into bank and sovereign balance sheets.\n\nSignals supporting this module:\n  • BIS Innovation Hub sets out 2025–26 work programme: AI-enabled supervision and green finance\n  • FSB Work Programme for 2025\n  • FSB: Analytical Framework and Toolkit to Assess Climate-Related Vulnerabilities\n  • Confirmed: 2024 was the hottest year on record, says UN weather agency\n  • Munich Re: natural disasters caused USD 140 billion of insured losses in 2024 as Los Angeles wildfires start 2025\n", "Central bank balance sheet and reserve management": "Central bank balance sheet and reserve management\n\nReasoning:\nImplications 2, 3, and 4 describe a subsystem in which central bank balance sheet operations—foreign exchange intervention and mark-to-market valuation of reserves—directly determine distributable profits and capital, creating a fiscal-monetary linkage to government budgets. Implication 1 concerns forward guidance and interest rate predictability transmitted through bond markets, a different channel, and is therefore excluded.\n\nSignals supporting this module:\n  • SNB data portal: EUR/CHF monthly average of 0.9416 in January 2025\n  • SNB expects record annual profit of around CHF 80 billion for 2024, resumes distribution to Confederation and cantons\n", "Conflict induced displacement and infrastructure shock": "Conflict induced displacement and infrastructure shock\n\nReasoning:\nAll implications describe armed conflict in fragile states generating displacement, infrastructure destruction, and fiscal pressures that transmit to financial stability through strained public finances, sovereign borrowing needs, risk premiums, capital flight, and disrupted trade and payment channels. Active conflict, refugee returns, and reconstruction gaps form a single conflict-to-fiscal-instability subsystem.\n\nSignals supporting this module:\n  • 'Famine conditions are spreading' as Sudan's crisis worsens: Security Council\n  • Critical aid blocked in Gaza, as fuel shortages threaten lifesaving services\n  • More than 125,000 refugees return to Syria in desperate conditions\n", "Swiss Franc Safe Haven Channel": "Swiss Franc Safe Haven Channel\n\nReasoning:\nSafe-haven capital inflows drive structural Swiss franc appreciation, which constrains monetary policy, suppresses imported inflation, and raises real debt burdens. Simultaneously, export earnings concentrate in chemicals and pharmaceuticals, narrowing the trade base and linking the current account and exchange rate to sector-specific shocks. Together these channels transmit external disturbances to bank balance sheets, credit exposures, and asset prices.\n\nSignals supporting this module:\n  • Bank of Japan raises policy rate to 0.5%, the highest level since 2008\n  • SNB data portal: EUR/CHF monthly average of 0.9416 in January 2025\n  • Swiss consumer prices fell 0.1% in December 2024; average annual inflation of 1.1% in 2024\n  • Swiss foreign trade 2024: record exports driven almost entirely by chemicals and pharmaceuticals\n", "Geopolitical financial infrastructure risk": "Geopolitical financial infrastructure risk\n\nReasoning:\nBoth implications describe geopolitical interference with the infrastructure underpinning cross-border finance: one through exclusion from messaging systems and immobilization of reserves, the other through state-backed cyber attacks on financial and communications systems. Both erode confidence in infrastructure neutrality and availability, prompting Swiss banks to adjust correspondent banking, collateral, liquidity buffers, and operational resilience, transmitting to financial stability through access and confidence channels.\n\nSignals supporting this module:\n  • EU Council extends economic sanctions against Russia for six months, until 31 July 2025\n  • OFAC sanctions Chinese firm linked to Salt Typhoon telecom hacks and hacker involved in US Treasury breach\n", "Tokenised payment and settlement infrastructure": "Tokenised payment and settlement infrastructure\n\nReasoning:\nAll three implications describe the migration of payment and settlement activity onto tokenised digital rails. Implication 1 covers central bank-led tokenised infrastructure; implications 2 and 3 cover private stablecoins displacing CBDCs and intermediating reserve-currency demand. Together they show a shared transmission path: new settlement rails alter liquidity management, counterparty and redemption exposure, and cross-border financial transmission, while concentrating risk in a small set of private issuers.\n\nSignals supporting this module:\n  • BIS Innovation Hub sets out 2025–26 work programme: AI-enabled supervision and green finance\n  • US Executive Order 14178 'Strengthening American Leadership in Digital Financial Technology' prohibits a US CBDC\n", "Sticky Inflation and Monetary Policy": "Sticky Inflation and Monetary Policy\n\nReasoning:\nAll implications trace a single transmission path: persistent inflation from wages, trade disruptions, or fiscal risk constrains monetary policy, keeping rates higher for longer; this raises debt-servicing costs across sovereign, corporate, and household sectors, erodes bank asset quality, and depresses long-dated asset valuations, forming one financial-stability subsystem.\n\nSignals supporting this module:\n  • ECB January 2025 – Rate Cut -25bp, Deposit Rate 2.75%\n  • IMF WEO Update January 2025 – Global Growth 3.3%, US Upgraded, Trade Policy Risk\n  • ILO World Employment and Social Outlook: Trends 2025\n  • UK 30-year gilt yields rise to highest level since 1998 amid concerns over public finances\n", "Cross-border cyber incident reporting": "Cross-border cyber incident reporting\n\nReasoning:\nBoth implications describe one transmission path: standardized cyber and ICT incident data plus third-party contract information flowing across borders, enabling supervisors to map shared technology exposures, detect contagion through common providers, and coordinate responses to limit systemic disruption.\n\nSignals supporting this module:\n  • EU Digital Operational Resilience Act (DORA) applies from 17 January 2025\n  • FSB: Public Responses to Consultation on Format for Incident Reporting Exchange (FIRE)\n", "Financial sanctions compliance perimeter": "Financial sanctions compliance perimeter\n\nReasoning:\nAll implications describe the same structural subsystem: the expansion and enforcement of international economic sanctions. They share a transmission path to financial stability through higher compliance costs, counterparty risk, de-risking, reduced access to dollar clearing, trade finance, and insurance, and persistent segmentation of cross-border financial relations along geopolitical blocs.\n\nSignals supporting this module:\n  • OFAC sanctions Chinese firm linked to Salt Typhoon telecom hacks and hacker involved in US Treasury breach\n  • OFAC sanctions Gazprom Neft, Surgutneftegas and 183 vessels in sweeping action against Russia's oil sector\n  • EU Council extends economic sanctions against Russia for six months, until 31 July 2025\n", "Multilateral humanitarian access subsystem": "Multilateral humanitarian access subsystem\n\nReasoning:\nAll three implications describe components of the international humanitarian aid system—early-warning data, logistics and supply chains, and donor financing—whose disruption transmits to financial stability through delayed aid, deepening crises, cross-border spillovers, food and energy price volatility, fiscal pressure on donor governments, contingent liabilities, and risks to exposed logistics and insurance firms.\n\nSignals supporting this module:\n  • 'Famine conditions are spreading' as Sudan's crisis worsens: Security Council\n  • Critical aid blocked in Gaza, as fuel shortages threaten lifesaving services\n  • More than 125,000 refugees return to Syria in desperate conditions\n", "Fiscal consolidation and debt sustainability": "Fiscal consolidation and debt sustainability\n\nReasoning:\nAll three implications describe a single subsystem: fiscal consolidation under debt constraints. Implication 3 establishes the macro context of eroding fiscal headroom and rising sovereign borrowing costs; implications 1 and 2 detail the resulting consolidation measures—expenditure cuts, broader taxation, and pension withdrawal taxes—and their transmission through household disposable income, bank sovereign exposures, pension fund liquidity, and broader financial conditions.\n\nSignals supporting this module:\n  • Swiss Federal Council opens consultation on 'relief package 27' to stabilise federal finances\n  • UK 30-year gilt yields rise to highest level since 1998 amid concerns over public finances\n", "Equity Market Risk Compression": "Equity Market Risk Compression\n\nReasoning:\nThe implications jointly describe an equity market subsystem in which suppressed implied volatility and muted political sensitivity underprice tail risk, while concentration in a narrow set of technology equities and passive index mechanics amplify single-stock shocks into broad market moves. AI cost breakthroughs can trigger abrupt repricing of these concentrated positions. Stress transmits via leverage, margin calls, dealer gamma hedging, index-tracking forced selling, and collateral erosion into credit, funding, and banking sectors.\n\nSignals supporting this module:\n  • CBOE VIX volatility index: January 2025 monthly average of 16.76 (range 14.85–19.54)\n  • DeepSeek shock: Nvidia loses about USD 590 billion in market value in record one-day drop\n"};

  const graphDetails = document.getElementById("graph-hover-details");
  let detailsPinned = false;

  function resizeDetailFrame() {
    if (!window.frameElement) return;
    requestAnimationFrame(function () {
      const graphHeight = document.getElementById("mynetwork").getBoundingClientRect().height;
      const detailHeight = graphDetails.getBoundingClientRect().height;
      const legendSpacing = 16;
      window.frameElement.style.height =
        Math.ceil(graphHeight + detailHeight + legendSpacing) + "px";
    });
  }

  const detailResizeObserver = new ResizeObserver(resizeDetailFrame);
  detailResizeObserver.observe(graphDetails);

  function clearGraphDetails() {
    detailsPinned = false;
    graphDetails.textContent = "No module or connection selected.";
    graphDetails.style.border = "1px solid #d9e2ec";
    graphDetails.style.borderTop = "0";
    resizeDetailFrame();
  }

  function showModuleDetails(moduleName) {
    graphDetails.textContent = graphModuleDetails[moduleName] || moduleName;
    graphDetails.style.border = "2px solid " + (graphModuleColors[moduleName] || "#888888");
    graphDetails.style.borderTop = "0";
    resizeDetailFrame();
  }

  function showEdgeDetails(edgeId) {
    graphDetails.textContent = graphEdgeDetails[edgeId] || "Connection details unavailable.";
    graphDetails.style.border = "2px solid #6b7280";
    graphDetails.style.borderTop = "0";
    resizeDetailFrame();
  }

  if (typeof network !== "undefined") {
    network.on("click", function (params) {
      if (params.nodes && params.nodes.length) {
        detailsPinned = true;
        showModuleDetails(params.nodes[0]);
      } else if (params.edges && params.edges.length) {
        detailsPinned = true;
        showEdgeDetails(params.edges[0]);
      } else {
        detailsPinned = false;
        clearGraphDetails();
      }
    });
  }
